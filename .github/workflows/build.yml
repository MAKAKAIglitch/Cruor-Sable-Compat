name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Linux builder
        if: runner.os == 'Linux'
        run: sh -n ./build.sh

      - name: Build with the Linux one-click builder
        if: runner.os == 'Linux'
        run: ./build.sh build --no-daemon

      - name: Validate Windows builder syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\build.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Build with the Windows one-click builder
        if: runner.os == 'Windows'
        shell: powershell
        run: .\build.bat build --no-daemon

      - name: Upload distributable mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: cruor-sable-compat-${{ matrix.os }}
          path: build/libs/cruor_sable_compat-*.jar
          if-no-files-found: error
          retention-days: 14
