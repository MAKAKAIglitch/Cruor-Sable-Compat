plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
    maven { url = 'https://www.cursemaven.com' }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        cruor_sable_compat {
            sourceSet(sourceSets.main)
        }
    }
}

// Keep optional development mods out of the published dependency metadata.
// This is the standard runtime-only setup used by the NeoForge 1.21.1 MDK.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // NeoForge supplies Mixin at runtime; this is compile-time API only.
    compileOnly "org.spongepowered:mixin:${project.mixin_version}"

    // Development run classpath only. Neither upstream mod is embedded in our JAR.
    localRuntime "curse.maven:sable-ragdolls-1572492:${project.sable_curse_file}"
    localRuntime "curse.maven:cruor-1729277:${project.cruor_curse_file}"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_version            : project.mod_version,
            mod_license            : project.mod_license,
            mod_authors            : project.mod_authors,
            mod_homepage           : project.mod_homepage,
            mod_issue_tracker      : project.mod_issue_tracker,
            mod_credits            : project.mod_credits,
            minecraft_version_range: project.minecraft_version_range,
            neo_version_range      : project.neo_version_range
    ]

    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : project.mod_name,
                'Specification-Vendor'  : project.mod_authors,
                'Specification-Version' : project.version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Built-On-Minecraft'    : project.minecraft_version,
                'MixinConfigs'          : 'cruor_sable_compat.mixins.json'
        ])
    }
}


/*
 * Resolve the artifacts needed for a later offline build.
 *
 * createMinecraftArtifacts prepares the Minecraft/NeoForge development artifacts.
 * The Java configurations cover project compile/runtime and test dependencies,
 * including the localRuntime CurseForge mods inherited by runtimeClasspath.
 */
def resolvePrefetchConfigurations = { List<String> configurationNames ->
    configurationNames.each { configurationName ->
        def configuration = configurations.findByName(configurationName)
        if (configuration == null || !configuration.canBeResolved) {
            logger.lifecycle("[PREFETCH] Skipping unavailable configuration: ${configurationName}")
        } else {
            logger.lifecycle("[PREFETCH] Resolving ${configurationName}...")
            def resolvedFiles = configuration.incoming.files.files
            logger.lifecycle("[PREFETCH] ${configurationName}: ${resolvedFiles.size()} file(s) ready.")
        }
    }
}

tasks.register('prefetchBuildDependencies') {
    group = 'build setup'
    description = 'Downloads and caches Minecraft, NeoForge, and compile dependencies required to build the mod.'

    dependsOn tasks.named('createMinecraftArtifacts')

    doLast {
        resolvePrefetchConfigurations([
                'neoFormRuntimeDependenciesNeoForgeClasses',
                'compileClasspath'
        ])
        logger.lifecycle('[PREFETCH] Required build dependencies are ready in the Gradle cache.')
    }
}

tasks.register('prefetchRuntimeDependencies') {
    group = 'build setup'
    description = 'Downloads and caches optional Sable/Cruor development runtime dependencies.'

    dependsOn tasks.named('prefetchBuildDependencies')

    doLast {
        resolvePrefetchConfigurations(['runtimeClasspath'])
        logger.lifecycle('[PREFETCH] Development runtime dependencies are ready in the Gradle cache.')
    }
}

tasks.register('prefetchAllDependencies') {
    group = 'build setup'
    description = 'Downloads and caches build and development runtime dependencies.'

    dependsOn tasks.named('prefetchBuildDependencies')
    dependsOn tasks.named('prefetchRuntimeDependencies')
}

/*
 * Every normal build preloads the same dependency set first. The task order
 * rules keep compilation/resource processing behind the prefetch step, so
 * cached artifacts are ready before Gradle's build tasks consume them.
 */
tasks.named('build') {
    dependsOn tasks.named('prefetchBuildDependencies')
}

tasks.withType(JavaCompile).configureEach {
    mustRunAfter tasks.named('prefetchBuildDependencies')
}

tasks.named('processResources') {
    mustRunAfter tasks.named('prefetchBuildDependencies')
}

// Runtime mods are not needed to package the compatibility JAR. Preload them
// before development game launches instead of making every JAR build depend on CurseMaven.
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn tasks.named('prefetchRuntimeDependencies')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
