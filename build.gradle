plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
    maven { url = 'https://www.cursemaven.com' }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        cruor_sable_compat {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // NeoForge supplies Mixin at runtime; this is compile-time API only.
    compileOnly "org.spongepowered:mixin:${project.mixin_version}"

    // Development run classpath only. Neither upstream mod is embedded in our JAR.
    modRuntimeOnly "curse.maven:sable-ragdolls-1572492:${project.sable_curse_file}"
    modRuntimeOnly "curse.maven:cruor-1729277:${project.cruor_curse_file}"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_version            : project.mod_version,
            mod_license            : project.mod_license,
            mod_authors            : project.mod_authors,
            mod_homepage           : project.mod_homepage,
            mod_issue_tracker      : project.mod_issue_tracker,
            mod_credits            : project.mod_credits,
            minecraft_version_range: project.minecraft_version_range,
            neo_version_range      : project.neo_version_range
    ]

    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : project.mod_name,
                'Specification-Vendor'  : project.mod_authors,
                'Specification-Version' : project.version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Built-On-Minecraft'    : project.minecraft_version,
                'MixinConfigs'          : 'cruor_sable_compat.mixins.json'
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
