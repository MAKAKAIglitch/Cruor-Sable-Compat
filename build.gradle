plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group

base {
    archivesName = "cruor-sable-compat-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
        }
        client {
            type = 'client'
        }
        server {
            type = 'server'
            programArguments.add('--nogui')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    compileOnly "org.spongepowered:mixin:${mixin_version}"

    // Development runtime only. These jars are not shaded into our output.
    runtimeOnly "curse.maven:sable-ragdolls-1572492:${sable_curse_file}"
    runtimeOnly "curse.maven:cruor-1729277:${cruor_curse_file}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    def expandProps = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_license: mod_license,
        mod_description: mod_description,
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neoforge_version: neoforge_version,
        neoforge_loader_version_range: neoforge_loader_version_range
    ]

    inputs.properties(expandProps)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(expandProps)
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : mod_name,
            'Specification-Vendor'  : 'MAKAKAIglitch',
            'Specification-Version' : project.version,
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Built-On-Minecraft'    : minecraft_version,
            'MixinConfigs'           : 'cruor_sable_compat.mixins.json'
        ])
    }
}
